{% extends 'webapp/base.html' %}
{% block title %}Session — DendrIQ{% endblock %}
{% block body %}
<div class="top-bar">
    <a class="action" href="javascript:history.back()"><i class="bi bi-arrow-left"></i></a>
    <span class="title">Détail de la session</span>
    <span style="width:24px;"></span>
</div>

<div id="loading" class="empty-state"><div class="spinner" style="border-top-color:var(--navy); margin:0 auto;"></div></div>

<div id="content" style="display:none;">
    <img id="cover" class="banner-image" style="margin:16px 20px; width:calc(100% - 40px); display:none;" alt="">

    <div class="section" style="margin-top:16px;">
        <div id="badges" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;"></div>
        <h1 id="title" style="font-size:1.4rem; font-weight:800; margin:0 0 10px; line-height:1.3;"></h1>

        <div class="card" style="margin-bottom:14px;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;"><i class="bi bi-clock" style="color:var(--navy);"></i><span id="time"></span></div>
            <div id="room-row" style="display:none; align-items:center; gap:8px; margin-bottom:8px;"><i class="bi bi-geo-alt" style="color:var(--navy);"></i><span id="room"></span></div>
            <div id="theme-row" style="display:none; align-items:center; gap:8px;"><i class="bi bi-tag" style="color:var(--navy);"></i><span id="theme"></span></div>
        </div>

        <div id="speaker-card" class="card" style="display:none; margin-bottom:14px;">
            <div style="display:flex; gap:12px; align-items:center;">
                <img id="speaker-photo" style="width:52px; height:52px; border-radius:50%; object-fit:cover; display:none;" alt="">
                <div>
                    <div id="speaker-name" style="font-weight:700;"></div>
                    <div id="speaker-title" style="font-size:0.85rem; color:var(--text-secondary);"></div>
                </div>
            </div>
            <div id="speaker-bio" style="font-size:0.88rem; color:var(--text-secondary); margin-top:10px; line-height:1.5; white-space:pre-line;"></div>
        </div>

        <div id="description-card" class="card" style="display:none;">
            <div style="font-weight:700; margin-bottom:6px;">Description</div>
            <div id="description" style="font-size:0.9rem; color:var(--text-secondary); line-height:1.5; white-space:pre-line;"></div>
        </div>

        <div id="ask-question-wrap">
            <button type="button" class="btn btn-secondary" id="ask-question-btn" style="display:flex; align-items:center; justify-content:center; gap:8px;">
                <i class="bi bi-chat-square-text"></i> Poser une question
            </button>
        </div>
    </div>
</div>

<div id="question-modal" class="qm-overlay" style="display:none;">
    <div class="qm-dialog">
        <div class="qm-title">Poser une question</div>
        <div class="qm-hint">Votre question sera posée à l'oral par l'intervenant pendant la session.</div>
        <textarea id="question-text" class="qm-textarea" rows="4" placeholder="Écrivez votre question ici..."></textarea>
        <div id="question-error" class="qm-error" style="display:none;"></div>
        <div class="qm-actions">
            <button type="button" class="btn btn-link" id="question-cancel-btn" style="width:auto;">Annuler</button>
            <button type="button" class="btn btn-primary" id="question-submit-btn" style="width:auto; padding:10px 20px; display:flex; align-items:center; gap:8px;">
                <span id="question-submit-label">Envoyer</span>
                <span id="question-submit-spinner" class="spinner" style="display:none; width:16px; height:16px; margin:0; border-width:2px;"></span>
            </button>
        </div>
    </div>
</div>

<div id="toast" class="qm-toast" style="display:none;"></div>
{% endblock %}
{% block extra_scripts %}
<script>
(function () {
    if (!requireAuth()) return;

    // URL is /app/(participant|controller)/session/<id>/ -- last non-empty
    // path segment is the session id.
    var sessionId = window.location.pathname.split('/').filter(Boolean).pop();

    // "Poser une question" mirrors the mobile app's SessionDetailScreen
    // exactly (same POST /session-questions/ payload, same dialog copy) --
    // and, like the mobile app, only participants get this button; badge
    // controllers have no such screen there.
    var askBtn = document.getElementById('ask-question-btn');
    var questionModal = document.getElementById('question-modal');
    var questionText = document.getElementById('question-text');
    var questionError = document.getElementById('question-error');
    var submitBtn = document.getElementById('question-submit-btn');
    var submitLabel = document.getElementById('question-submit-label');
    var submitSpinner = document.getElementById('question-submit-spinner');
    var submitting = false;

    if (Auth.getRole() === 'controlleur_des_badges') {
        document.getElementById('ask-question-wrap').style.display = 'none';
    } else {
        askBtn.addEventListener('click', function () {
            questionText.value = '';
            questionError.style.display = 'none';
            questionModal.style.display = 'flex';
            questionText.focus();
        });

        document.getElementById('question-cancel-btn').addEventListener('click', function () {
            if (!submitting) questionModal.style.display = 'none';
        });
        questionModal.addEventListener('click', function (e) {
            if (e.target === questionModal && !submitting) questionModal.style.display = 'none';
        });

        submitBtn.addEventListener('click', function () {
            var text = questionText.value.trim();
            if (!text) {
                questionError.textContent = 'Veuillez entrer une question';
                questionError.style.display = 'block';
                return;
            }

            submitting = true;
            submitBtn.disabled = true;
            submitLabel.style.display = 'none';
            submitSpinner.style.display = 'inline-block';

            Api.post('/session-questions/', { session: sessionId, question_text: text }).then(function (r) {
                return r.json().then(function (data) { return { ok: r.ok, data: data }; });
            }).then(function (result) {
                submitting = false;
                submitBtn.disabled = false;
                submitLabel.style.display = 'inline';
                submitSpinner.style.display = 'none';

                if (result.ok) {
                    questionModal.style.display = 'none';
                    showToast('Question envoyée ! Elle sera posée à l\'oral pendant la session.', false);
                } else {
                    questionError.textContent = result.data.error || result.data.message || result.data.detail || 'Une erreur est survenue';
                    questionError.style.display = 'block';
                }
            }).catch(function () {
                submitting = false;
                submitBtn.disabled = false;
                submitLabel.style.display = 'inline';
                submitSpinner.style.display = 'none';
                questionError.textContent = 'Erreur réseau. Vérifiez votre connexion.';
                questionError.style.display = 'block';
            });
        });
    }

    function showToast(message, isError) {
        var toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'qm-toast' + (isError ? ' error' : '');
        toast.style.display = 'block';
        setTimeout(function () { toast.style.display = 'none'; }, 3000);
    }

    function fmt(iso) {
        return wallClockDate(iso).toLocaleString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    }

    loadWithCache('session_' + sessionId, function () {
        return Api.get('/sessions/' + encodeURIComponent(sessionId) + '/').then(function (r) {
            if (!r.ok) throw new Error('not found');
            return r.json();
        });
    }, function (s) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        document.getElementById('title').textContent = s.title || '';

        if (s.cover_image_url) {
            var cover = document.getElementById('cover');
            cover.src = s.cover_image_url;
            cover.style.display = 'block';
        }

        // A session can genuinely go live (or its price/type could change)
        // while this page is open, and the 2-minute poll/pull-to-refresh
        // re-runs this whole callback -- reset before rebuilding instead
        // of appending on top of whatever was already there.
        var badges = document.getElementById('badges');
        badges.innerHTML = '';
        if (s.is_live) badges.innerHTML += '<span style="font-size:0.72rem; font-weight:700; color:#fff; background:var(--error); padding:4px 10px; border-radius:999px;"><i class="bi bi-broadcast"></i> EN DIRECT</span>';
        if (s.is_paid) badges.innerHTML += '<span style="font-size:0.72rem; font-weight:700; color:#fff; background:var(--warning); padding:4px 10px; border-radius:999px;">' + escapeHtml(s.price ? s.price + ' DZD' : 'Payant') + '</span>';
        if (s.session_type) badges.innerHTML += '<span style="font-size:0.72rem; font-weight:700; color:var(--navy); background:var(--surface-2); padding:4px 10px; border-radius:999px;">' + escapeHtml(s.session_type) + '</span>';

        var timeText = s.start_time ? fmt(s.start_time) : '';
        if (s.end_time) timeText += ' – ' + wallClockDate(s.end_time).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('time').textContent = timeText;

        if (s.room_name) {
            document.getElementById('room').textContent = s.room_name;
            document.getElementById('room-row').style.display = 'flex';
        }
        if (s.theme) {
            document.getElementById('theme').textContent = s.theme;
            document.getElementById('theme-row').style.display = 'flex';
        }

        if (s.speaker_name) {
            document.getElementById('speaker-card').style.display = 'block';
            document.getElementById('speaker-name').textContent = s.speaker_name;
            document.getElementById('speaker-title').textContent = s.speaker_title || '';
            document.getElementById('speaker-bio').textContent = s.speaker_bio || '';
            if (s.speaker_photo_url) {
                var photo = document.getElementById('speaker-photo');
                photo.src = s.speaker_photo_url;
                photo.style.display = 'block';
            }
        }

        if (s.description) {
            document.getElementById('description-card').style.display = 'block';
            document.getElementById('description').textContent = s.description;
        }
    }, function () {
        document.getElementById('loading').innerHTML = '<div class="empty-state">Impossible de charger cette session.</div>';
    });
})();
</script>
{% endblock %}
