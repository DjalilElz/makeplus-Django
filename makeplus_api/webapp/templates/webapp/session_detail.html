{% extends 'webapp/base.html' %}
{% block title %}Session — DendrIQ{% endblock %}
{% block body %}
<div class="top-bar">
    <a class="action" href="javascript:history.back()"><i class="bi bi-arrow-left"></i></a>
    <span class="title">Détail de la session</span>
    <span style="width:24px;"></span>
</div>

<div id="loading" class="empty-state"><div class="spinner" style="border-top-color:var(--navy); margin:0 auto;"></div></div>

<div id="content" style="display:none;">
    <img id="cover" class="banner-image" style="margin:16px 20px; width:calc(100% - 40px); display:none;" alt="">

    <div class="section" style="margin-top:16px;">
        <div id="badges" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;"></div>
        <h1 id="title" style="font-size:1.4rem; font-weight:800; margin:0 0 10px; line-height:1.3;"></h1>

        <div class="card" style="margin-bottom:14px;">
            <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;"><i class="bi bi-clock" style="color:var(--navy);"></i><span id="time"></span></div>
            <div id="room-row" style="display:none; align-items:center; gap:8px; margin-bottom:8px;"><i class="bi bi-geo-alt" style="color:var(--navy);"></i><span id="room"></span></div>
            <div id="theme-row" style="display:none; align-items:center; gap:8px;"><i class="bi bi-tag" style="color:var(--navy);"></i><span id="theme"></span></div>
        </div>

        <div id="speaker-card" class="card" style="display:none; margin-bottom:14px;">
            <div style="display:flex; gap:12px; align-items:center;">
                <img id="speaker-photo" style="width:52px; height:52px; border-radius:50%; object-fit:cover; display:none;" alt="">
                <div>
                    <div id="speaker-name" style="font-weight:700;"></div>
                    <div id="speaker-title" style="font-size:0.85rem; color:var(--text-secondary);"></div>
                </div>
            </div>
            <div id="speaker-bio" style="font-size:0.88rem; color:var(--text-secondary); margin-top:10px; line-height:1.5; white-space:pre-line;"></div>
        </div>

        <div id="description-card" class="card" style="display:none;">
            <div style="font-weight:700; margin-bottom:6px;">Description</div>
            <div id="description" style="font-size:0.9rem; color:var(--text-secondary); line-height:1.5; white-space:pre-line;"></div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
(function () {
    if (!requireAuth()) return;

    // URL is /app/(participant|controller)/session/<id>/ -- last non-empty
    // path segment is the session id.
    var sessionId = window.location.pathname.split('/').filter(Boolean).pop();

    function fmt(iso) {
        return new Date(iso).toLocaleString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    }

    Api.get('/sessions/' + encodeURIComponent(sessionId) + '/').then(function (r) {
        if (!r.ok) throw new Error('not found');
        return r.json();
    }).then(function (s) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        document.getElementById('title').textContent = s.title || '';

        if (s.cover_image_url) {
            var cover = document.getElementById('cover');
            cover.src = s.cover_image_url;
            cover.style.display = 'block';
        }

        var badges = document.getElementById('badges');
        if (s.is_live) badges.innerHTML += '<span style="font-size:0.72rem; font-weight:700; color:#fff; background:var(--error); padding:4px 10px; border-radius:999px;"><i class="bi bi-broadcast"></i> EN DIRECT</span>';
        if (s.is_paid) badges.innerHTML += '<span style="font-size:0.72rem; font-weight:700; color:#fff; background:var(--warning); padding:4px 10px; border-radius:999px;">' + escapeHtml(s.price ? s.price + ' DZD' : 'Payant') + '</span>';
        if (s.session_type) badges.innerHTML += '<span style="font-size:0.72rem; font-weight:700; color:var(--navy); background:var(--surface-2); padding:4px 10px; border-radius:999px;">' + escapeHtml(s.session_type) + '</span>';

        var timeText = s.start_time ? fmt(s.start_time) : '';
        if (s.end_time) timeText += ' – ' + new Date(s.end_time).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('time').textContent = timeText;

        if (s.room_name) {
            document.getElementById('room').textContent = s.room_name;
            document.getElementById('room-row').style.display = 'flex';
        }
        if (s.theme) {
            document.getElementById('theme').textContent = s.theme;
            document.getElementById('theme-row').style.display = 'flex';
        }

        if (s.speaker_name) {
            document.getElementById('speaker-card').style.display = 'block';
            document.getElementById('speaker-name').textContent = s.speaker_name;
            document.getElementById('speaker-title').textContent = s.speaker_title || '';
            document.getElementById('speaker-bio').textContent = s.speaker_bio || '';
            if (s.speaker_photo_url) {
                var photo = document.getElementById('speaker-photo');
                photo.src = s.speaker_photo_url;
                photo.style.display = 'block';
            }
        }

        if (s.description) {
            document.getElementById('description-card').style.display = 'block';
            document.getElementById('description').textContent = s.description;
        }
    }).catch(function () {
        document.getElementById('loading').innerHTML = '<div class="empty-state">Impossible de charger cette session.</div>';
    });
})();
</script>
{% endblock %}
