{% extends 'webapp/base.html' %}
{% load static %}
{% block title %}Programme — DendrIQ{% endblock %}
{% block body %}
<div class="top-bar">
    <span class="title">Programme</span>
    <button class="action" id="pdf-toggle" style="display:none;"><i class="bi bi-file-earmark-pdf" id="pdf-toggle-icon"></i></button>
</div>
<div id="loading" class="empty-state"><div class="spinner" style="border-top-color:var(--navy); margin:0 auto;"></div></div>
<div id="session-list" class="section" style="display:none;"></div>
<div id="empty" class="empty-state" style="display:none;"><div class="icon"><i class="bi bi-calendar-x"></i></div>Aucune session au programme pour le moment.</div>
<iframe id="pdf-frame" style="display:none; width:100%; height:calc(100dvh - 140px); border:none;"></iframe>
{% endblock %}
{% block extra_scripts %}
<script src="{% static 'webapp/js/program.js' %}"></script>
{% endblock %}
