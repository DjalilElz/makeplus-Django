{% extends 'webapp/base.html' %}
{% block title %}Accueil — DendrIQ Contrôleur{% endblock %}
{% block body %}
<div class="top-bar">
    <span class="title" id="greeting">Bonjour</span>
    <a class="action" href="/app/install/">📲</a>
</div>

<div id="loading" class="empty-state"><div class="spinner" style="border-top-color:var(--navy); margin:0 auto;"></div></div>
<div id="event-content" style="display:none;">
    <div class="event-hero">
        <div class="eyebrow">Contrôle des badges</div>
        <div class="event-name" id="event-name"></div>
        <div class="event-meta" id="event-dates"></div>
        <div class="event-meta" id="event-location"></div>
    </div>
    <div class="section">
        <a href="/app/controller/scanner/" class="btn btn-primary" style="display:flex;">▦ Scanner un badge</a>
        <a href="/app/controller/program/" class="btn btn-secondary" style="display:flex; margin-top:10px;">📋 Voir le programme</a>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
(function () {
    if (!requireAuth()) return;

    Api.get('/auth/me/').then(function (r) { return r.json(); }).then(function (me) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('event-content').style.display = 'block';
        document.getElementById('greeting').textContent = 'Bonjour, ' + (me.first_name || me.full_name || '');

        var event = me.event || {};
        document.getElementById('event-name').textContent = event.name || '';
        document.getElementById('event-location').textContent = event.location ? '📍 ' + event.location : '';
        if (event.start_date && event.end_date) {
            var start = new Date(event.start_date), end = new Date(event.end_date);
            var opts = { day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('event-dates').textContent =
                '🗓 ' + start.toLocaleDateString('fr-FR', opts) + ' – ' + end.toLocaleDateString('fr-FR', opts);
        }

        Auth.setSession({
            access: Auth.getAccess(), refresh: Auth.getRefresh(),
            role: me.role, event: me.event,
            user: { id: me.id, email: me.email, first_name: me.first_name, last_name: me.last_name },
        });
    }).catch(function () {
        document.getElementById('loading').innerHTML = '<div class="empty-state">Impossible de charger l\'événement.</div>';
    });
})();
</script>
{% endblock %}
