{% extends 'webapp/base.html' %}
{% block title %}Choisir un événement — DendrIQ{% endblock %}
{% block body %}
<div class="top-bar">
    <span class="title">Choisir un événement</span>
    <button class="action" onclick="Auth.logout()">Annuler</button>
</div>
<p class="page-subtitle">Vous avez accès à plusieurs événements. Sélectionnez celui que vous souhaitez ouvrir.</p>

<div id="error-box" class="alert alert-error section" style="display:none;"></div>
<div class="section">
    <div class="list" id="event-list"></div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
(function () {
    var tempToken = sessionStorage.getItem('dq_temp_token');
    var events = [];
    try { events = JSON.parse(sessionStorage.getItem('dq_available_events') || '[]'); } catch (e) {}

    if (!tempToken || !events.length) {
        window.location.href = '/app/login/';
        return;
    }

    var listEl = document.getElementById('event-list');
    var errorBox = document.getElementById('error-box');

    events.forEach(function (event) {
        var row = document.createElement('div');
        row.className = 'list-row';
        row.style.cursor = 'pointer';
        var dates = '';
        if (event.start_date) {
            var d = new Date(event.start_date);
            dates = d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
        }
        row.innerHTML =
            '<div style="flex:1; min-width:0;">' +
                '<div style="font-weight:700;">' + escapeHtml(event.name) + '</div>' +
                '<div style="font-size:0.8rem; color:var(--text-secondary);">' + escapeHtml([dates, event.location].filter(Boolean).join(' · ')) + '</div>' +
            '</div><span style="color:var(--text-secondary);">›</span>';
        row.addEventListener('click', function () { selectEvent(event.id, row); });
        listEl.appendChild(row);
    });

    function selectEvent(eventId, row) {
        errorBox.style.display = 'none';
        row.style.opacity = '0.5';

        fetch(Api.BASE + '/auth/select-event/', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + tempToken, 'Content-Type': 'application/json' },
            body: JSON.stringify({ event_id: eventId }),
        }).then(function (response) {
            return response.json().then(function (data) { return { ok: response.ok, data: data }; });
        }).then(function (result) {
            if (!result.ok) throw new Error(result.data.detail || result.data.error || "Échec de la sélection.");
            sessionStorage.removeItem('dq_temp_token');
            sessionStorage.removeItem('dq_available_events');
            Auth.setSession(result.data);
            window.location.href = Auth.homeUrl();
        }).catch(function (err) {
            row.style.opacity = '1';
            errorBox.textContent = err.message;
            errorBox.style.display = 'block';
        });
    }
})();
</script>
{% endblock %}
