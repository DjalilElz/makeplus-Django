{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MakePlus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --banner-1: #2D1B6B;
            --banner-2: #46309a;
            --banner-3: #3a2480;
            --steel-blue: #7BA7BC;
            --dusty-rose: #E8B9B9;
            --dusty-rose-dark: #8B4B4B;
            --cream: #FAF6F0;
            --ink: #1a1a1a;
            --border-light: #E7E2DC;
            --gold: #C9A227;
            --gold-soft: #E3C36B;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background: linear-gradient(135deg, var(--banner-1) 0%, var(--banner-2) 55%, var(--banner-3) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #2c2c2c;
            position: relative;
            overflow: hidden;
        }

        /* Signature blurred accent from the registration banner */
        body::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 520px;
            height: 520px;
            background: var(--steel-blue);
            opacity: 0.25;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -25%;
            left: -12%;
            width: 460px;
            height: 460px;
            background: var(--dusty-rose);
            opacity: 0.18;
            border-radius: 50%;
            filter: blur(70px);
            z-index: 0;
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 448px;
            background: var(--cream);
            border-radius: 20px;
            box-shadow: 0 24px 70px rgba(20, 10, 50, 0.4);
            overflow: hidden;
        }

        /* Thin gold rule across the top, pairing gold with the purple */
        .login-card::before {
            content: '';
            display: block;
            height: 4px;
            background: linear-gradient(90deg, var(--gold) 0%, var(--gold-soft) 50%, var(--gold) 100%);
        }

        .login-brand {
            text-align: center;
            padding: 42px 44px 20px;
        }

        .login-brand img {
            height: 54px;
            width: auto;
            margin-bottom: 16px;
        }

        .brand-slogan {
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .login-body {
            padding: 4px 44px 44px;
        }

        .login-heading {
            font-family: var(--font-serif);
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--banner-1);
            text-align: center;
            margin-bottom: 4px;
        }

        .login-subtitle {
            text-align: center;
            color: var(--dusty-rose-dark);
            font-size: 0.92rem;
            margin-bottom: 26px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            color: var(--banner-1);
            margin-bottom: 6px;
        }

        .input-group-text {
            background: #fff;
            border: 1px solid var(--border-light);
            border-right: none;
            color: var(--banner-2);
        }

        .form-control {
            border: 1px solid var(--border-light);
            border-left: none;
            padding: 12px 14px;
            background: #fff;
        }

        .form-control:focus {
            border-color: var(--banner-2);
            box-shadow: none;
            background: #fff;
        }

        .input-group:focus-within .input-group-text {
            border-color: var(--banner-2);
        }

        .btn-signin {
            background: linear-gradient(135deg, var(--banner-1), var(--banner-2));
            border: none;
            color: #fff;
            font-family: var(--font-sans);
            font-weight: 600;
            letter-spacing: 0.02em;
            padding: 13px;
            border-radius: 11px;
            width: 100%;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .btn-signin:hover {
            color: #fff;
            transform: translateY(-1px);
            box-shadow: 0 10px 26px rgba(45, 27, 107, 0.4);
        }

        .btn-signin:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 2px;
        }

        .alert {
            border-radius: 11px;
            font-size: 0.9rem;
            border: none;
        }
        .alert-error, .alert-danger {
            background: #F5E3E1;
            color: #6b3f3f;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-brand">
            <img src="{% static 'dashboard/images/Makeplus Full logo.svg' %}" alt="MakePlus">
            <div class="brand-slogan">Events Management</div>
        </div>

        <div class="login-body">
            <h1 class="login-heading">Welcome back</h1>
            <p class="login-subtitle">Sign in to manage your events</p>

            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="your@email.com" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                </div>

                <button type="submit" class="btn-signin">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </button>
            </form>
        </div>
    </div>
</body>
</html>
