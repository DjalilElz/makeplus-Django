{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import en cours — {{ event.name }}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'dashboard/images/makeplus-icon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --banner-1: #2D1B6B; --banner-2: #46309a; --banner-3: #3a2480; --cream: #FAF6F0; --border-light: #E7E2DC; --font-serif: 'Playfair Display', serif; --font-sans: 'Inter', sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--cream); font-family: var(--font-sans); min-height: 100vh; color: #2c2c2c; }
        .elegant-banner { background: linear-gradient(135deg, var(--banner-1) 0%, var(--banner-2) 55%, var(--banner-3) 100%); color: #fff; padding: 36px 20px 44px; }
        .banner-content { max-width: 700px; margin: 0 auto; }
        .event-title { font-family: var(--font-serif); font-size: 1.9rem; font-weight: 700; }
        .page-wrapper { max-width: 700px; margin: -20px auto 0; padding: 0 20px 60px; position: relative; z-index: 3; }
        .content-card { background: #fff; border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); padding: 28px; }
        .btn-outline-elegant { background: transparent; border: 1px solid var(--banner-1); color: var(--banner-1); border-radius: 10px; font-size: 0.85rem; font-weight: 600; padding: 8px 18px; text-decoration: none; display: inline-block; }
        .btn-outline-elegant:hover { background: var(--banner-1); color: #fff; }
        .text-warning-dark { color: #946200; }
        #import-log { margin-top: 18px; max-height: 260px; overflow-y: auto; border: 1px solid var(--border-light); border-radius: 10px; padding: 10px 12px; font-size: 0.82rem; background: #fcfbf9; }
        #import-log .log-line { padding: 3px 0; border-bottom: 1px solid #f1eee8; white-space: pre-wrap; word-break: break-word; }
        #import-log .log-line:last-child { border-bottom: none; }
        #import-log .log-ok { color: #1a1a1a; }
        #import-log .log-ok i { color: #2e7d32; }
        #import-log .log-err { color: #8a2d2d; }
        #import-log .log-err i { color: #c0392b; }
        #import-log .log-empty { color: #9a9a9a; font-style: italic; }
    </style>
</head>
<body>
    <div class="elegant-banner">
        <div class="banner-content">
            <h1 class="event-title"><i class="bi bi-cloud-upload"></i> Import des participants</h1>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="content-card">
            <p id="progress-text">Préparation de l'import...</p>
            <div class="progress" style="height: 24px;">
                <div id="progress-bar" class="progress-bar" role="progressbar" style="width: 0%; background-color: #2D1B6B;">0%</div>
            </div>

            <div id="import-log"><div class="log-line log-empty">En attente...</div></div>

            <div id="email-phase" class="mt-4 d-none">
                <p id="email-progress-text" class="small text-muted mb-1">Envoi des e-mails de confirmation...</p>
                <div class="progress" style="height: 10px;">
                    <div id="email-progress-bar" class="progress-bar" role="progressbar" style="width: 0%; background-color: #8a7bc8;"></div>
                </div>
            </div>

            <a href="{% url 'dashboard:event_owner_submissions' event.id %}" class="btn btn-outline-elegant mt-4 d-none" id="done-link">
                <i class="bi bi-list-ul"></i> Voir les inscriptions
            </a>
        </div>
    </div>

<script>
(function() {
    // Everything here is resume-aware: these starting values come from
    // the server's current state (see _progress_snapshot), not from
    // zero -- reloading this page after a lost connection or a closed
    // tab re-renders it with whatever has actually been done so far, so
    // the bar and the log both pick up where they left off instead of
    // restarting.
    const total = {{ total }};
    let doneSoFar = {{ done_so_far }};
    let createdTotal = {{ created_count }};
    let failedTotal = {{ failed_count }};
    const creationAlreadyDone = {{ creation_done|yesno:"true,false" }};
    const emailTotal = {{ email_total }};
    const emailAlreadySent = emailTotal - {{ email_remaining }};

    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const doneLink = document.getElementById('done-link');
    const logEl = document.getElementById('import-log');

    function setProgress(n) {
        const pct = total > 0 ? Math.min(100, Math.round((n / total) * 100)) : 100;
        progressBar.style.width = pct + '%';
        progressBar.textContent = pct + '%';
        progressText.textContent = `${n} / ${total} traité(s)...`;
    }

    function logRow(entry) {
        if (logEl.querySelector('.log-empty')) logEl.innerHTML = '';
        const line = document.createElement('div');
        if (entry.status === 'created') {
            line.className = 'log-line log-ok';
            line.innerHTML = `<i class="bi bi-check-circle-fill"></i> ${escapeHtml(entry.label)}` +
                (entry.email ? ` <span class="text-muted">(${escapeHtml(entry.email)})</span>` : '') + ' — ajouté(e)';
        } else {
            line.className = 'log-line log-err';
            line.innerHTML = `<i class="bi bi-x-circle-fill"></i> ${escapeHtml(entry.label)}` +
                (entry.email ? ` <span class="text-muted">(${escapeHtml(entry.email)})</span>` : '') +
                ` — erreur : ${escapeHtml(entry.error || '?')}`;
        }
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // Retries forever on a failed or stalled request -- a real dropped
    // connection, or a request that's taking so long the browser itself
    // gives up waiting -- with capped exponential backoff, instead of
    // giving up and asking for a manual reload. A request that comes
    // back with valid JSON but success:false is a real server-side
    // error, not a stall, so that's surfaced immediately rather than
    // retried forever. REQUEST_TIMEOUT_MS bounds how long any single
    // attempt waits before being treated as stalled and retried -- well
    // under the server's own request timeout, so a request this client
    // gives up on is one the server was about to give up on too, not one
    // that's silently still working.
    const RETRY_DELAYS = [2000, 5000, 10000, 20000, 30000];
    const REQUEST_TIMEOUT_MS = 25000;
    async function postAction(action, onRetrying) {
        let attempt = 0;
        while (true) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
            try {
                const response = await fetch(window.location.href, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'action=' + action,
                    signal: controller.signal,
                });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return await response.json();
            } catch (err) {
                const delay = RETRY_DELAYS[Math.min(attempt, RETRY_DELAYS.length - 1)];
                onRetrying(delay);
                await new Promise(resolve => setTimeout(resolve, delay));
                attempt++;
            } finally {
                clearTimeout(timeoutId);
            }
        }
    }

    // Retry immediately (instead of waiting out the current backoff)
    // the moment the browser reports connectivity back.
    window.addEventListener('online', () => {
        progressText.classList.remove('text-danger');
    });

    async function sendNextBatch() {
        const data = await postAction('batch', (delay) => {
            progressText.textContent =
                `Le serveur met du temps à répondre — nouvelle tentative dans ${Math.round(delay / 1000)}s... (les ` +
                `${createdTotal} participant(s) déjà créé(s) sont conservés)`;
            progressText.classList.add('text-danger');
        });
        progressText.classList.remove('text-danger');

        if (!data.success) {
            progressText.textContent = data.error || "Échec de l'import.";
            progressText.classList.add('text-danger');
            return;
        }

        if (data.busy) {
            // Every remaining row is currently claimed by another
            // in-flight request (e.g. one left running after a reload) --
            // not an error, just wait a moment for it to free up.
            setTimeout(sendNextBatch, 500);
            return;
        }

        (data.rows || []).forEach(logRow);

        doneSoFar += data.created_this_batch + data.failed_this_batch;
        createdTotal += data.created_this_batch;
        failedTotal += data.failed_this_batch;
        setProgress(doneSoFar);

        if (data.done) {
            finishCreation();
            return;
        }

        setTimeout(sendNextBatch, 150);
    }

    function finishCreation() {
        progressText.textContent = `Terminé : ${createdTotal} participant(s) créé(s)` + (failedTotal > 0 ? `, ${failedTotal} échec(s).` : '.');
        doneLink.classList.remove('d-none');
        // Registrations already exist and are fully usable at this
        // point -- email sending continues on its own below without
        // making the admin wait any further for it.
        if (emailTotal > 0) {
            startEmailPhase();
        }
    }

    const emailPhase = document.getElementById('email-phase');
    const emailProgressBar = document.getElementById('email-progress-bar');
    const emailProgressText = document.getElementById('email-progress-text');

    function setEmailProgress(sentSoFar) {
        const pct = emailTotal > 0 ? Math.min(100, Math.round((sentSoFar / emailTotal) * 100)) : 100;
        emailProgressBar.style.width = pct + '%';
        emailProgressText.textContent = `Envoi des e-mails de confirmation : ${sentSoFar} / ${emailTotal}...`;
    }

    async function sendNextEmailBatch(sentSoFar) {
        const data = await postAction('send_emails', (delay) => {
            emailProgressText.textContent =
                `Le serveur met du temps à répondre — nouvelle tentative dans ${Math.round(delay / 1000)}s... ` +
                `(${sentSoFar} e-mail(s) déjà envoyé(s))`;
        });

        if (!data.success) {
            emailProgressText.textContent = data.error || "Échec de l'envoi des e-mails.";
            return;
        }

        const newSentSoFar = sentSoFar + data.sent_this_batch;
        setEmailProgress(newSentSoFar);

        if (data.done) {
            emailProgressText.textContent = `E-mails de confirmation envoyés (${newSentSoFar}).`;
            return;
        }

        setTimeout(() => sendNextEmailBatch(newSentSoFar), 200);
    }

    function startEmailPhase() {
        emailPhase.classList.remove('d-none');
        if (emailAlreadySent >= emailTotal) {
            setEmailProgress(emailAlreadySent);
            emailProgressText.textContent = `E-mails de confirmation envoyés (${emailAlreadySent}).`;
            return;
        }
        setEmailProgress(emailAlreadySent);
        sendNextEmailBatch(emailAlreadySent);
    }

    setProgress(doneSoFar);
    if (creationAlreadyDone) {
        if (doneSoFar > 0) logRow({status: 'created', label: `Reprise : ${createdTotal} déjà créé(s)` + (failedTotal > 0 ? `, ${failedTotal} échec(s)` : '')});
        finishCreation();
    } else {
        sendNextBatch();
    }
})();
</script>
</body>
</html>
