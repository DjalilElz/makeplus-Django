<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sélectionner un événement - MakePlus</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --banner-1: #2D1B6B;
            --banner-2: #46309a;
            --banner-3: #3a2480;
            --steel-blue: #7BA7BC;
            --dusty-rose: #E8B9B9;
            --cream: #FAF6F0;
            --border-light: #E7E2DC;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--cream);
            font-family: var(--font-sans);
            min-height: 100vh;
            color: #2c2c2c;
        }
        .elegant-banner {
            background: linear-gradient(135deg, var(--banner-1) 0%, var(--banner-2) 55%, var(--banner-3) 100%);
            color: #fff;
            padding: 36px 20px 44px;
            position: relative;
            overflow: hidden;
        }
        .elegant-banner::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -12%;
            width: 380px;
            height: 380px;
            background: var(--steel-blue);
            opacity: 0.28;
            border-radius: 50%;
            filter: blur(60px);
        }
        .banner-content {
            position: relative;
            z-index: 2;
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 12px;
        }
        .banner-eyebrow {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--dusty-rose);
            margin-bottom: 8px;
        }
        .event-title { font-family: var(--font-serif); font-size: 1.9rem; font-weight: 700; }
        .back-link { color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.85rem; margin-right: 16px; }
        .back-link:hover { color: #fff; }
        .page-wrapper { max-width: 1100px; margin: -20px auto 0; padding: 0 20px 60px; position: relative; z-index: 3; }
        .content-card {
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 28px;
        }
        .event-tile {
            background: var(--cream);
            border: 1px solid var(--border-light);
            border-radius: 14px;
            padding: 20px;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .event-tile:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            border-color: var(--banner-1);
        }
        .event-tile h6 { font-family: var(--font-serif); font-weight: 700; color: var(--banner-1); }
    </style>
</head>
<body>
    <div class="elegant-banner">
        <div class="banner-content">
            <div>
                <div class="banner-eyebrow">Gestionnaire des salles</div>
                <h1 class="event-title">Communications orales finales</h1>
            </div>
            <div>
                <a href="{% url 'dashboard:my_room_sessions' %}" class="back-link"><i class="bi bi-chat-dots"></i> Mes sessions &amp; questions</a>
                <a href="{% url 'dashboard:logout' %}" class="back-link"><i class="bi bi-box-arrow-right"></i> Déconnexion</a>
            </div>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="content-card">
            <h5 class="mb-4">Sélectionner un événement</h5>
            <div class="row g-3">
                {% for event in events %}
                <div class="col-md-6 col-lg-4">
                    <a href="{% url 'dashboard:final_communications' event.id %}" class="text-decoration-none text-dark">
                        <div class="event-tile h-100">
                            <h6 class="mb-2">{{ event.name }}</h6>
                            <p class="text-muted small mb-0">
                                <i class="bi bi-calendar"></i> {{ event.start_date|date:"d/m/Y" }} - {{ event.end_date|date:"d/m/Y" }}
                            </p>
                        </div>
                    </a>
                </div>
                {% empty %}
                <p class="text-muted">Aucun événement trouvé.</p>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
