{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MakePlus{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'dashboard/images/makeplus-icon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --banner-1: #2D1B6B;
            --banner-2: #46309a;
            --banner-3: #3a2480;
            --steel-blue: #7BA7BC;
            --dusty-rose: #E8B9B9;
            --cream: #FAF6F0;
            --ink: #1a1a1a;
            --border-light: #E7E2DC;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--cream);
            font-family: var(--font-sans);
            min-height: 100vh;
            color: #2c2c2c;
        }
        .elegant-banner {
            background: linear-gradient(135deg, var(--banner-1) 0%, var(--banner-2) 55%, var(--banner-3) 100%);
            color: #fff;
            padding: 36px 20px 44px;
            position: relative;
            overflow: hidden;
        }
        .elegant-banner::before {
            content: '';
            position: absolute;
            top: -30%; right: -12%;
            width: 380px; height: 380px;
            background: var(--steel-blue);
            opacity: 0.28;
            border-radius: 50%;
            filter: blur(60px);
        }
        .banner-content { position: relative; z-index: 2; max-width: 860px; margin: 0 auto; }
        .banner-eyebrow {
            font-size: 0.78rem; font-weight: 600; letter-spacing: 0.22em;
            text-transform: uppercase; color: var(--dusty-rose); margin-bottom: 8px;
        }
        .page-title { font-family: var(--font-serif); font-size: 1.9rem; font-weight: 700; }
        .page-wrapper { max-width: 860px; margin: -20px auto 0; padding: 0 20px 60px; position: relative; z-index: 3; }
        .content-card {
            background: #fff; border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 32px;
        }
        .section { margin-bottom: 22px; }
        .section h2 {
            font-family: var(--font-sans);
            font-size: 1rem; font-weight: 700; color: var(--banner-1);
            margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
        }
        .section p { font-size: 0.94rem; line-height: 1.65; color: #444; }
        .meta { font-size: 0.8rem; color: #8a8a8a; margin-bottom: 18px; }
        .callout {
            background: var(--cream); border: 1px solid var(--border-light);
            border-radius: 14px; padding: 18px 22px; margin-top: 24px;
        }
        .callout p { font-size: 0.9rem; line-height: 1.6; margin: 0; }
        a { color: var(--banner-2); }
        ol, ul { padding-left: 1.3rem; }
        ol li, ul li { font-size: 0.94rem; line-height: 1.7; color: #444; }
        footer {
            text-align: center; padding: 20px;
            font-size: 0.8rem; color: #8a8a8a;
        }
    </style>
</head>
<body>
    <div class="elegant-banner">
        <div class="banner-content">
            <div class="banner-eyebrow">MakePlus</div>
            <h1 class="page-title">{% block heading %}{% endblock %}</h1>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="content-card">
            {% block content %}{% endblock %}
        </div>
    </div>

    <footer>MakePlus &middot; <a href="{% url 'legal_privacy_policy' %}">Confidentialité</a> &middot; <a href="{% url 'legal_account_deletion' %}">Suppression de compte</a></footer>
</body>
</html>
