{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimer le badge - {{ name }}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'dashboard/images/makeplus-icon.svg' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        /* Badge is printed at its exact physical size: 65mm x 100mm, 2mm padding. */
        @page {
            size: 65mm 100mm;
            margin: 0;
        }

        @media print {
            .no-print {
                display: none !important;
            }
            body {
                margin: 0;
                padding: 0;
                background: white;
                min-height: 0;
            }
            .badge-container {
                box-shadow: none;
                border: none;
            }
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .badge-container {
            width: 65mm;
            height: 100mm;
            padding: 2mm;
            box-sizing: border-box;
            background: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3mm;
            text-align: center;
            overflow: hidden;
        }

        .qr-code {
            width: 55mm;
            height: 55mm;
            display: block;
        }

        .participant-name {
            font-size: 4.2mm;
            line-height: 1.2;
            font-weight: 700;
            color: #000;
            text-transform: uppercase;
            word-break: break-word;
            max-width: 61mm;
        }

        .button-group {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .print-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s;
        }

        .print-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
    </style>
</head>
<body>
    <div class="badge-container">
        <img src="data:image/png;base64,{{ qr_code_base64 }}"
             alt="QR Code"
             class="qr-code">
        <div class="participant-name">{{ name }}</div>
    </div>

    <div class="button-group no-print">
        <button onclick="window.print()" class="btn btn-primary btn-lg print-button">
            <i class="bi bi-printer-fill"></i> Imprimer le badge (Ctrl+P)
        </button>
        <button onclick="window.close()" class="btn btn-secondary btn-lg">
            <i class="bi bi-x-circle"></i> Fermer
        </button>
    </div>

    <script>
        // Auto-open print dialog on load
        window.addEventListener('load', function() {
            // Small delay to ensure images are fully loaded
            setTimeout(function() {
                window.print();
            }, 800);
        });
    </script>
</body>
</html>
